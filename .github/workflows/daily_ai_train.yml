name: Daily AI Brain Training (US Champion)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kódu z repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inštalácia knižníc
        run: |
          pip install httpx pandas numpy scikit-learn xgboost supabase

      - name: Spustenie denného AI trénera
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python daily_train.py
